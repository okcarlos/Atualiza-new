<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atualiza New</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<!-- seu conteúdo -->

<section class="controle card">

    <div class="arquivo-area">

        <label for="arquivo" class="arquivo-label">

                <span class="arquivo-icon">
                    📁
                </span>

            <span>

                    <strong>
                        Selecionar planilha
                    </strong>

                    <small id="nomeArquivo">
                        Nenhum arquivo selecionado
                    </small>

                </span>

        </label>

        <input
                type="file"
                id="arquivo"
                accept=".xlsx,.xls"
        >

    </div>

    <div class="corban-area">

        <label for="corban">
            New Corban
        </label>

        <select id="corban">

            <option value="">
                Selecione...
            </option>

            <option value="IEV">
                IEV
            </option>

            <option value="CS">
                CS
            </option>

        </select>

    </div>

    <div class="acoes">

        <button
                id="btnIniciar"
                class="btn btn-primary"
        >
            ▶ Iniciar análise
        </button>

        <button
                id="btnCancelar"
                class="btn btn-danger"
                disabled
        >
            ■ Parar
        </button>

    </div>

</section>

<script src="./script.js"></script>

</body>

</html>
